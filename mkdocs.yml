site_name: funstruct
site_description: Fun & functional structures for Python

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep-purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep-purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

nav:
  - Home: index.md
  - Playground: playground.html
  - Guides:
      - What is a Monad?: guides/monads.md
      - The Typeclass Pattern: guides/typeclass_pattern.md
      - Railway Oriented Programming: guides/railway_oriented_programming.md
      - Tagless Final Style: guides/tagless_final.md
      - Do-Notation: guides/do_notation.md
      - Async Operations: guides/async.md
      - Evaluation Strategy: guides/evaluation_strategy.md
      - Creating a Data Type: guides/creating_a_data_type.md
      - Anti-Patterns: guides/antipatterns.md
  - Typeclasses:
      - Overview: typeclass/index.md
      - Semigroup: typeclass/semigroup.md
      - Monoid: typeclass/monoid.md
      - Functor: typeclass/functor.md
      - Applicative: typeclass/applicative.md
      - Alternative: typeclass/alternative.md
      - Monad: typeclass/monad.md
      - MonadError: typeclass/monad_error.md
      - Foldable: typeclass/foldable.md
      - Traversable: typeclass/traversable.md
      - Bifunctor: typeclass/bifunctor.md
  - Monads:
      - Overview: monad/index.md
      - Option: monad/option.md
      - Either: monad/either.md
      - Result: monad/result.md
      - Reader: monad/reader.md
      - Writer: monad/writer.md
      - State: monad/state.md
      - Future: monad/future.md
  - Applicatives:
      - Overview: applicative/index.md
      - Validated: applicative/validated.md
      - ZipList: applicative/ziplist.md
  - Collections:
      - Overview: collections/index.md
      - CList: collections/cons.md
      - frozendict: collections/frozendict.md
      - Tree: collections/tree.md
  - Utilities:
      - tailrec: util/tailrec.md
      - CapturesCreationSiteMixin: util/created_at.md
  - Experimental:
      - Monad Transformers:
          - Overview: experimental/monadtransformer/index.md
          - ReaderT: experimental/monadtransformer/reader_t.md
          - StateT: experimental/monadtransformer/state_t.md
          - EitherT: experimental/monadtransformer/either_t.md
          - OptionT: experimental/monadtransformer/option_t.md
          - WriterT: experimental/monadtransformer/writer_t.md
      - Optics (Lenses): experimental/optics/index.md

extra:
  version:
    provider: mike

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_docstring_examples: true
