site_name: funstruct
site_description: Fun & functional structures for Python

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep-purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep-purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

nav:
  - Home: index.md
  - typeclass:
      - Overview: typeclass/index.md
      - Semigroup: typeclass/semigroup.md
      - Monoid: typeclass/monoid.md
      - Functor: typeclass/functor.md
      - Applicative: typeclass/applicative.md
      - Monad: typeclass/monad.md
  - applicative:
      - Validated: applicative/validated.md
  - monad:
      - State: monad/state.md
      - StateT: monad/state_t.md
      - ReaderT: monad/reader_t.md
  - collections:
      - Cons: collections/cons.md
      - frozendict: collections/frozendict.md
  - util:
      - tailrec: util/tailrec.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_docstring_examples: true
