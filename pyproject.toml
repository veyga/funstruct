[project]
name = "funstruct"
version = "1.0.0"
description = "Fun & functional structures for Python"
authors = [{name = "Andrew Stefanich", email = "andrewstefanich@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["functional", "immutable", "fp", "data structures", "cons"]
dependencies = []

[project.urls]
Homepage = "https://github.com/veyga/funstruct"
Repository = "https://github.com/veyga/funstruct"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funstruct"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-benchmark[histogram]>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-parametrization>=2022.2.1",
    "ruff>=0.8.0",
    "debugpy>=1.8.0",
    "ty>=0.0.74",
    "nox[uv]>=2026.8.17",
    "pre-commit>=4.6.2",
]
docs = [
    "mike>=2.2.0",
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mdformat>=1.0",
    "mdformat-mkdocs>=3.0",
    "docformatter>=1.7",
]

[tool.ty]
# Subclasses narrow return types (e.g. Option.bind returns Option, not Monad).
# This is correct covariant narrowing but ty flags it as Liskov violation.
rules.invalid-method-override = "ignore"
# Transformers accept `monad` as a plain `type` param but call .pure()/.bind()
# on it (duck-typed). ty can't see the protocol — it just sees `type`.
rules.unresolved-attribute = "ignore"
# `cls(...)` returns Self which ty can't reconcile with declared return types
# like `WriterT[F, W, B]` when the TypeVars shift in map/bind.
rules.invalid-return-type = "ignore"
# bind/map lambdas return Functor[B] but the concrete type expects the subclass.
# Same covariant narrowing issue at call sites.
rules.invalid-argument-type = "ignore"

[tool.ty.environment]
root = ["."]

[tool.coverage.run]
source = ["funstruct"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore=benchmarks"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E731", # Do not assign a `lambda` expression, use a `def`
]


[tool.docformatter]
wrap-summaries = 80
wrap-descriptions = 80
# pre-summary-newline = false
# close-quotes-on-newline = false
