[project]
name = "funstruct"
version = "1.0.0"
description = "Fun & functional structures for Python"
authors = [{name = "Andrew Stefanich", email = "andrewstefanich@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["functional", "immutable", "fp", "data structures", "cons"]
dependencies = []

[project.urls]
Homepage = "https://github.com/veyga/funstruct"
Repository = "https://github.com/veyga/funstruct"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funstruct"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-parametrization>=2022.2.1",
    "ruff>=0.8.0",
    "debugpy>=1.8.0",
    "ty>=0.0.74",
    "nox[uv]>=2026.8.17",
    "pre-commit>=4.6.2",
]
docs = [
    "mike>=2.2.0",
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mdformat>=1.0",
    "mdformat-mkdocs>=3.0",
    "docformatter>=1.7",
]

[tool.ty]
rules.invalid-method-override = "ignore"

[tool.ty.environment]
root = ["."]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E731", # Do not assign a `lambda` expression, use a `def`
]


[tool.docformatter]
wrap-summaries = 80
wrap-descriptions = 80
# pre-summary-newline = false
# close-quotes-on-newline = false
