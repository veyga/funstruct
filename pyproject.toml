[project]
name = "funstruct"
version = "1.0.0"
description = "Fun & functional structures for Python"
authors = [{name = "Andrew Stefanich", email = "andrewstefanich@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["functional", "immutable", "fp", "data structures", "cons"]
dependencies = [
    "returns>=0.26.0,<0.27.0; python_version<'3.11'",
    "returns>=0.29.0; python_version>='3.11'",
]

[project.urls]
Homepage = "https://github.com/veyga/funstruct"
Repository = "https://github.com/veyga/funstruct"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["funstruct"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-parametrization>=2022.2.1",
    "ruff>=0.8.0",
    "debugpy>=1.8.0",
    "ty>=0.0.74",
    "tox>=4.60.1",
    "tox-uv>=1.36.0",
    "pre-commit>=4.6.2",
]
docs = [
    "mike>=2.2.0",
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mdformat>=1.0",
    "mdformat-mkdocs>=3.0",
]

[tool.ty.environment]
root = ["."]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E731", # Do not assign a `lambda` expression, use a `def`
]
